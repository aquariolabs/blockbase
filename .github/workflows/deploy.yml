name: Deploy

on:
  workflow_call:

env:
  POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

jobs:
  deploy-preview:
    name: 🚤 Deploy preview
    # only execute on non-production branches
    if: github.ref != 'refs/heads/main'
    permissions:
      pull-requests: write
      contents: read
      deployments: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: 🏗️ Build APPS
        run: vp run website#build

      - name: ☁️ Upload preview Worker version
        id: deploy
        uses: wladpaiva/varlock-wrangler-action@codex/detect-parent-lockfiles
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          packageManager: vp
          skipInstall: true
          varlockVersion: 1.2.0
          varlockCloudflareIntegrationVersion: 1.1.2
          wranglerVersion: 4.94.0
          command: versions upload --preview-alias ${{ env.PREVIEW_ALIAS }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment Preview URL on PR
        if: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        uses: moojing/cf-preview-bot@v1
        with:
          deployment_url: ${{ steps.deploy.outputs.deployment-url }}
          branch_preview_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

  deploy-production:
    name: 🚀 Deploy production
    # only execute on the main branch
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: 🏗️ Build APPS
        run: vp run website#build

      - name: ☁️ Deploy Worker
        uses: wladpaiva/varlock-wrangler-action@codex/detect-parent-lockfiles
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          packageManager: vp
          skipInstall: true
          varlockVersion: 1.2.0
          varlockCloudflareIntegrationVersion: 1.1.2
          wranglerVersion: 4.94.0
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
