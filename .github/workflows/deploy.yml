name: Deploy

on:
  workflow_call:

env:
  POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

jobs:
  deploy-preview:
    name: 🚤 Deploy preview
    # only execute on non-production branches
    if: github.ref != 'refs/heads/main'
    permissions:
      pull-requests: write
      contents: read
      deployments: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.branch-preview-url }}
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: 🏗️ Build APPS
        run: vp run website#build

      - name: ☁️ Upload preview Worker version
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail

          output="$(vp run website#deploy:preview --preview-alias "$PREVIEW_ALIAS" | tee /dev/stderr)"

          deployment_url="$(printf '%s\n' "$output" | sed -n 's/^Version Preview URL: //p' | tail -n 1)"
          branch_preview_url="$(printf '%s\n' "$output" | sed -n 's/^Version Preview Alias URL: //p' | tail -n 1)"

          if [ -z "$deployment_url" ] || [ -z "$branch_preview_url" ]; then
            echo "Could not find preview URLs in deploy output."
            exit 1
          fi

          {
            echo "deployment-url=$deployment_url"
            echo "branch-preview-url=$branch_preview_url"
          } >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        if: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        uses: moojing/cf-preview-bot@v1
        with:
          deployment_url: ${{ steps.deploy.outputs.deployment-url }}
          branch_preview_url: ${{ steps.deploy.outputs.branch-preview-url }}

  deploy-production:
    name: 🚀 Deploy production
    # only execute on the main branch
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: production
      #  TODO: replace with the correct project route
      url: "https://dia-zero.aquariolabs.com"
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: 🏗️ Build APPS
        run: vp run website#build

      - name: ☁️ Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run website#deploy:production
