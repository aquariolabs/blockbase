name: Deploy

on:
  workflow_call:

env:
  POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
  # `wrangler deploy` reports no URL for a custom domain, so the production
  # environment links here. TODO: replace with the project's domain, as in
  # `apps/website/wrangler.jsonc`.
  PRODUCTION_URL: https://blockbase.aquariolabs.com

# Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  deploy-website:
    name: ☁️ Deploy website
    permissions:
      contents: read
      deployments: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ github.ref == 'refs/heads/main' && env.PRODUCTION_URL || steps.versions-upload.outputs.pages-deployment-alias-url }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      # Only the website and what it depends on. No `cache`: restoring the
      # package store takes about as long as downloading the packages.
      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26.12.1"
          cache: false
          run-install: |
            args: ["--filter", "website..."]

      - name: 🏗️ Build Website
        run: vp run website#build

      - name: ☁️ Deploy Worker
        id: deploy
        # only execute on the main branch
        if: github.ref == 'refs/heads/main'
        uses: wladpaiva/varlock-wrangler-action@d7e5c817510422a6a1670865eac4fa157e9f4df1 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          packageManager: vp
          skipInstall: true
          command: deploy

      - name: ☁️ Upload preview Worker version
        id: versions-upload
        # only execute on non-production branches
        if: github.ref != 'refs/heads/main'
        uses: wladpaiva/varlock-wrangler-action@d7e5c817510422a6a1670865eac4fa157e9f4df1 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          packageManager: vp
          skipInstall: true
          preCommands: wrangler triggers deploy
          command: versions upload --preview-alias ${{ env.PREVIEW_ALIAS }}
