name: Anonymize snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Recreates <preview-group>-anon-snapshot from a read-only view of production.
# Raw rows are transformed in memory and only the anonymized rows are written
# to the preview group. Pull requests never receive the production token.
concurrency:
  group: anonymize-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Anonymize snapshot
    if: github.ref_name == github.event.repository.default_branch
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: anonymize
    timeout-minutes: 30
    steps:
      - name: Skip unless the anonymize environment is configured
        id: gate
        env:
          TURSO_ORGANIZATION_SLUG: ${{ vars.TURSO_ORGANIZATION_SLUG }}
          TURSO_PREVIEW_GROUP_NAME: ${{ vars.TURSO_PREVIEW_GROUP_NAME }}
          TURSO_PREVIEW_GROUP_TOKEN: ${{ secrets.TURSO_PREVIEW_GROUP_TOKEN }}
          TURSO_PROD_DATABASE_URL: ${{ vars.TURSO_PROD_DATABASE_URL }}
          TURSO_PROD_READ_TOKEN: ${{ secrets.TURSO_PROD_READ_TOKEN }}
          ANON_HASH_KEY: ${{ secrets.ANON_HASH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${TURSO_ORGANIZATION_SLUG}" ] || missing+=("vars.TURSO_ORGANIZATION_SLUG")
          [ -n "${TURSO_PREVIEW_GROUP_NAME}" ] || missing+=("vars.TURSO_PREVIEW_GROUP_NAME")
          [ -n "${TURSO_PREVIEW_GROUP_TOKEN}" ] || missing+=("secrets.TURSO_PREVIEW_GROUP_TOKEN")
          [ -n "${TURSO_PROD_DATABASE_URL}" ] || missing+=("vars.TURSO_PROD_DATABASE_URL")
          [ -n "${TURSO_PROD_READ_TOKEN}" ] || missing+=("secrets.TURSO_PROD_READ_TOKEN")
          [ -n "${ANON_HASH_KEY}" ] || missing+=("secrets.ANON_HASH_KEY")
          if [ "${#missing[@]}" -eq 6 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Anonymized snapshot off::Set the anonymize environment vars and secrets to copy production into the preview group."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Anonymized snapshot configuration is incomplete: ${missing[*]}" >&2
            exit 1
          fi
          case "${TURSO_PREVIEW_GROUP_NAME}-anon-snapshot" in
            *-production)
              echo "Refusing to seed preview data from ${TURSO_PREVIEW_GROUP_NAME}-anon-snapshot." >&2
              exit 1
              ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out repo
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Vite+
        if: steps.gate.outputs.enabled == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26.12.1"
          cache: false
          run-install: |
            args: ["--filter", "@workspace/db..."]

      - name: Recreate the empty snapshot
        id: snapshot
        if: steps.gate.outputs.enabled == 'true'
        env:
          TURSO_ORGANIZATION_SLUG: ${{ vars.TURSO_ORGANIZATION_SLUG }}
          TURSO_PREVIEW_GROUP_NAME: ${{ vars.TURSO_PREVIEW_GROUP_NAME }}
          TURSO_PREVIEW_GROUP_TOKEN: ${{ secrets.TURSO_PREVIEW_GROUP_TOKEN }}
        run: vp run db#snapshot

      - name: Migrate the snapshot
        if: steps.gate.outputs.enabled == 'true'
        env:
          VARLOCK_ENV: preview
          DATABASE_URL: ${{ steps.snapshot.outputs.database_url }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PREVIEW_GROUP_TOKEN }}
        run: vp run db#migrate

      - name: Copy anonymized rows
        if: steps.gate.outputs.enabled == 'true'
        env:
          TURSO_PROD_DATABASE_URL: ${{ vars.TURSO_PROD_DATABASE_URL }}
          TURSO_PROD_READ_TOKEN: ${{ secrets.TURSO_PROD_READ_TOKEN }}
          SNAPSHOT_DATABASE_URL: ${{ steps.snapshot.outputs.database_url }}
          SNAPSHOT_DATABASE_NAME: ${{ steps.snapshot.outputs.database_name }}
          TURSO_PREVIEW_GROUP_TOKEN: ${{ secrets.TURSO_PREVIEW_GROUP_TOKEN }}
          ANON_HASH_KEY: ${{ secrets.ANON_HASH_KEY }}
        run: vp run db#anonymize
