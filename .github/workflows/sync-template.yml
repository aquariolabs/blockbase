name: Sync Template

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create template token
        id: template-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: aquariolabs
          repositories: dia-zero
          permission-contents: read

      - name: Create target token
        id: target-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Sync template
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TEMPLATE_TOKEN: ${{ steps.template-token.outputs.token }}
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "dia-zero-template-sync[bot]"
          git config user.email "dia-zero-template-sync[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TARGET_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add template "https://x-access-token:${TEMPLATE_TOKEN}@github.com/aquariolabs/dia-zero.git"
          git fetch --no-tags template main

          if git merge-base --is-ancestor template/main HEAD; then
            echo "Template is already merged."
            exit 0
          fi

          template_sha="$(git rev-parse --short template/main)"
          branch="chore/template-sync-${template_sha}"

          git switch -c "${branch}"
          git merge --no-edit template/main
          git push --force-with-lease origin "${branch}"

          if gh pr view "${branch}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Template sync pull request already exists for ${branch}."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "Sync Dia Zero template" \
            --body "Merge aquariolabs/dia-zero@${template_sha} into ${GITHUB_REPOSITORY}."
