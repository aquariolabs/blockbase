name: Sync Template

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create template token
        id: template-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: aquariolabs
          repositories: dia-zero
          permission-contents: read

      - name: Create target token
        id: target-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Sync template
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TEMPLATE_TOKEN: ${{ steps.template-token.outputs.token }}
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "dia-zero-template-sync[bot]"
          git config user.email "dia-zero-template-sync[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TARGET_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add template "https://x-access-token:${TEMPLATE_TOKEN}@github.com/aquariolabs/dia-zero.git"
          git fetch --no-tags template main

          if git merge-base --is-ancestor template/main HEAD; then
            echo "Template is already merged."
            exit 0
          fi

          template_sha="$(git rev-parse --short template/main)"
          branch="chore/template-sync-${template_sha}"
          body_file="$(mktemp)"

          git switch -c "${branch}"
          merge_status="clean"

          if ! git merge --no-edit template/main; then
            merge_status="conflicted"
            conflicted_files="$(git diff --name-only --diff-filter=U | sort)"

            {
              echo "Merge aquariolabs/dia-zero@${template_sha} into ${GITHUB_REPOSITORY}."
              echo
              echo "This automatic template sync found conflicts that need manual resolution."
              echo "Conflict markers were committed so the pull request can be reviewed and resolved normally."
              echo
              echo "Conflicted files:"
              printf '%s\n' "${conflicted_files}" | sed 's/^/- /'
            } > "${body_file}"

            git add -A
            git commit --no-edit
          else
            echo "Merge aquariolabs/dia-zero@${template_sha} into ${GITHUB_REPOSITORY}." > "${body_file}"
          fi

          git push --force-with-lease origin "${branch}"

          existing_pr_count="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${branch}" \
            --state open \
            --json number \
            --jq 'length')"

          if [ "${existing_pr_count}" != "0" ]; then
            echo "Template sync pull request already exists for ${branch}."
            exit 0
          fi

          pr_options=()

          if [ "${merge_status}" = "conflicted" ]; then
            pr_options+=(--draft)
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "Sync Dia Zero template" \
            --body-file "${body_file}" \
            "${pr_options[@]}"

          if [ "${merge_status}" = "conflicted" ]; then
            echo "::warning::Template sync opened a pull request with conflicts."
          fi
