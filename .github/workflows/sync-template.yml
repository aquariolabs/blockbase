name: Sync Template

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create template token
        id: template-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: aquariolabs
          repositories: dia-zero
          permission-contents: read

      - name: Create target token
        id: target-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: actions-template-sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: aquariolabs/dia-zero
          upstream_branch: main
          source_gh_token: ${{ steps.template-token.outputs.token }}
          target_gh_token: ${{ steps.target-token.outputs.token }}
