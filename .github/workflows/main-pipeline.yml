name: CI/CD Orchestrator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A new push to a pull request cancels its run in progress. On main runs
# wait for each other instead: cancelling one could stop a production
# deploy halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test-stage:
    uses: ./.github/workflows/test.yml

  deploy-stage:
    needs: test-stage
    # PRs from dependabot won't deploy to prevent a malicious package exfiltrate secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
