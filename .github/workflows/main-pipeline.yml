name: CI/CD Orchestrator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A new push to a pull request cancels its run in progress. On main runs
# wait for each other instead: cancelling one could stop a production
# deploy halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test-stage:
    uses: ./.github/workflows/test.yml

  preview-database:
    needs: test-stage
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: ./.github/workflows/preview-database.yml
    secrets: inherit

  deploy-stage:
    needs:
      - test-stage
      - preview-database
    # A skipped preview database (push to the default branch, or preview vars
    # unset) must not block deploy. A failed one must.
    if: >-
      ${{
        !cancelled() &&
        !failure() &&
        (needs.preview-database.result == 'success' || needs.preview-database.result == 'skipped') &&
        (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
      }}
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
