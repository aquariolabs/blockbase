name: Tests

on:
  workflow_call:

env:
  VARLOCK_ENV: "test"

permissions:
  contents: read

jobs:
  # All checks in one job, one step each: every job pays for a runner, a
  # checkout and installing the workspace.
  test:
    name: 🧪 Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      # No `cache`: restoring the package store takes as long as downloading
      # the packages, and saving it adds time to the job.
      - name: ⚡ Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26.12.1"
          cache: false

      # Vite+'s task cache (`run.tasks` in `vite.config.ts`): a check whose
      # files didn't change since a run that passed it replays its output.
      # This branch's last run, or main's.
      - name: 📦 Restore the task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: ⬣ Format, lint & type check
        run: vp run check

      - name: 🚦 Run unit tests
        run: vp run test

      # Every package's build, so a template or page that breaks fails here.
      - name: 🏗️ Build
        run: vp run -r build

      # CI runs Chromium headless, which needs only its headless shell. Never
      # from the task cache: a replay installs nothing on a fresh runner.
      - name: 🎭 Install Playwright's Chromium and OS dependencies
        run: vp run --no-cache setup:playwright --only-shell

      - name: 🎭 Run Playwright tests
        timeout-minutes: 10
        run: vp run -r test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/website/playwright-report/
          retention-days: 30

      # Also when a step failed: only the checks that passed are kept.
      - name: 📦 Save the task cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
