packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@fontsource-variable/inter": ^5.2.8
  "@playwright/test": ^1.59.1
  "@storybook/addon-docs": 10.4.1
  "@storybook/react-vite": 10.4.1
  "@tailwindcss/vite": ^4.2.4
  "@types/node": ^24.12.2
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  evlog: ^2.13.0
  lucide-react: ^1.0.0
  portless: ^0.13.0
  radix-ui: ^1.4.3
  react: ^19.2.5
  react-dom: ^19.2.5
  shadcn: ^4.4.0
  storybook: 10.4.1
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.1
  tw-animate-css: ^1.4.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
