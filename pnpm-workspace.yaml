packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@tailwindcss/vite": ^4.2.4
  "@types/node": ^24.12.2
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  evlog: ^2.13.0
  react: ^19.2.5
  react-dom: ^19.2.5
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: manual

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
